name: Repository hygiene
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: GdeiAssistant/.github/actions/repository-hygiene@6d342d39a5a3c8aa74120c51911d0461aa8fc747
