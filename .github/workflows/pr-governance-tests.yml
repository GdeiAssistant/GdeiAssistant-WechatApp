name: PR governance tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
jobs:
  test:
    name: Governance offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test .github/governance/test-*.cjs
