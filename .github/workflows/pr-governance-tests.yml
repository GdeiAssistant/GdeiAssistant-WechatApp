name: PR governance tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
jobs:
  test:
    name: Governance offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/governance/test-*.cjs
