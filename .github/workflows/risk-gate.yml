name: PR risk gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [created, rerequested, completed]
  workflow_run:
    workflows: [PR review signal]
    types: [completed]
  push:
    branches: [master]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to evaluate
        required: true
        type: string

permissions: {}

# Isolate untrusted events before workflow concurrency can replace a pending run.
concurrency:
  group: >-
    ${{ ((github.event_name == 'issue_comment' &&
         (!github.event.issue.pull_request ||
          (github.event.comment.user.id != 20649888 && github.event.comment.user.id != 136622811))) ||
         (github.event_name == 'check_run' && github.event.check_run.app.id != 347564)) &&
        format('pr-governance-ignored-{0}', github.run_id) || 'pr-governance' }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Unrelated events also skip execution; their concurrency groups are isolated.
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        (github.event.comment.user.id == 20649888 || github.event.comment.user.id == 136622811))) &&
      (github.event_name != 'check_run' || github.event.check_run.app.id == 347564)
    name: Evaluate PR governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
      checks: read
    steps:
      - name: Evaluate with current default-branch policy only
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { data: repository } = await github.rest.repos.get(context.repo);
            const defaultBranch = repository.default_branch;
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: defaultBranch });
            const policyCommit = branch.commit.sha;
            const folder = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'pr-governance-'));
            const sources = {};
            // Never load code, policy, dependencies, caches or artifacts from the PR.
            for (const name of ['gate.cjs', 'runner.cjs', 'policy.json']) {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: `.github/governance/${name}`, ref: policyCommit,
              });
              if (data.type !== 'file' || data.encoding !== 'base64' || !data.content) throw new Error('Missing trusted policy file');
              sources[name] = Buffer.from(data.content, 'base64').toString('utf8');
              fs.writeFileSync(path.join(folder, name), sources[name]);
            }
            const { data: workflow } = await github.rest.repos.getContent({
              ...context.repo, path: '.github/workflows/risk-gate.yml', ref: policyCommit,
            });
            if (workflow.type !== 'file' || workflow.encoding !== 'base64' || !workflow.content) throw new Error('Missing trusted workflow');
            sources['risk-gate.yml'] = Buffer.from(workflow.content, 'base64').toString('utf8');
            const { data: config } = await github.rest.repos.getContent({
              ...context.repo, path: '.coderabbit.yaml', ref: policyCommit,
            });
            if (config.type !== 'file' || config.encoding !== 'base64' || !config.content) throw new Error('Missing trusted reviewer config');
            sources['.coderabbit.yaml'] = Buffer.from(config.content, 'base64').toString('utf8');
            const { digest } = require(path.join(folder, 'gate.cjs'));
            await require(path.join(folder, 'runner.cjs')).run({
              github, context, core, defaultBranch, policyCommit,
              policy: JSON.parse(sources['policy.json']), policySha: digest(sources),
            });
