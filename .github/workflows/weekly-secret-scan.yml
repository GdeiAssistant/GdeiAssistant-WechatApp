# Shared governance action: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40.
# Requires the SECRET_SCAN_BASELINE_B64 secret.
# Keep the job names; they are required status check contexts.

name: Weekly secret scan

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-secret-scan
  cancel-in-progress: false

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan history
        uses: GdeiAssistant/.github/pr-governance@4c296692ae2efbce09bc21b6641299f368435c40
        env:
          SECRET_SCAN_BASELINE_B64: ${{ secrets.SECRET_SCAN_BASELINE_B64 }}
        with:
          mode: scan
          full-history: 'true'
