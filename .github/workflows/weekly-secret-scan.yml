name: Weekly secret scan

# Requires the SECRET_SCAN_BASELINE_B64 secret: the
# redacted identities of findings that predate the policy. The scan refuses to
# run without it, so an empty baseline can never be mistaken for a clean history.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-secret-scan
  cancel-in-progress: false

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan history
        uses: Pigbibi/PrGovernance/pr-governance@ccda8de572d2893272b0137526ef3e2d45e5eee7
        env:
          SECRET_SCAN_BASELINE_B64: ${{ secrets.SECRET_SCAN_BASELINE_B64 }}
        with:
          mode: scan
          full-history: 'true'
