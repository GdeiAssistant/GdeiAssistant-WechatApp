name: PR review signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Wake-up only. No checkout, artifact, provider call or credentials.
permissions: {}
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'
